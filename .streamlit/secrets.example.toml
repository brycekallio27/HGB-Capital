# Copy this file to .streamlit/secrets.toml and fill in real values.
# secrets.toml is gitignored and must never be committed.

[connections.gsheets]
spreadsheet = "https://docs.google.com/spreadsheets/d/your-sheet-id"
type = "service_account"
project_id = "your-gcp-project-id"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "your-service-account@your-project.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/your-service-account%40your-project.iam.gserviceaccount.com"

# ---------------------------------------------------------------------------
# Clerk authentication — app.py verifies the Clerk session JWT against this
# JWKS URL/issuer, then matches the verified email against [partners.*].email
# below. Get jwks_url/issuer from Clerk Dashboard -> Configure -> API keys.
# landing_url is where the "Sign In With Clerk" button sends signed-out users
# (your Netlify landing site URL in production, localhost:3000 in dev).
# ---------------------------------------------------------------------------

[clerk]
jwks_url = "https://your-instance.clerk.accounts.dev/.well-known/jwks.json"
issuer = "https://your-instance.clerk.accounts.dev"
landing_url = "http://localhost:3000"

# The app maps verified Clerk emails to these partner records — no PINs,
# no passwords stored here. Add one [partners.<key>] block per partner.
[partners.bryce]
name = "Bryce"
email = "partner1@example.com"

[partners.hunter]
name = "Hunter"
email = "partner2@example.com"

[partners.grayson]
name = "Grayson"
email = "partner3@example.com"
